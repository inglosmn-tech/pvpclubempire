name: Python validation
on:
  push:
    branches:
      - main
      - feature/inglotiers-and-trivia
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Compile bot and extensions
        run: python -m compileall -q main.py extensions
