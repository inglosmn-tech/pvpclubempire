name: Python and website validation
on:
  push:
    branches:
      - main
      - feature/spam-tiers-site-upgrade
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Compile bot and extensions
        run: python -m compileall -q main.py extensions scripts
      - name: Smoke-test Discord API and security helpers
        run: python scripts/check_security_upgrade.py
      - name: Check embedded website JavaScript
        run: |
          python scripts/check_website_js.py main.py /tmp/pvpclubtiers-inline.js
          node --check /tmp/pvpclubtiers-inline.js
